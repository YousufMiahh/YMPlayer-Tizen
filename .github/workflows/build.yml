name: Build YMPlayer.wgt

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

env:
  # Pins - bump deliberately if download.tizen.org moves things around.
  TIZEN_STUDIO_VERSION: "5.6"
  TIZEN_CLI_INSTALLER: web-cli_Tizen_Studio_5.6_ubuntu-64.bin
  TIZEN_HOME: ${{ github.workspace }}/../tizen-studio

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run unit tests
        run: |
          npm ci
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Tizen Studio CLI (tizen + sdb)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip libxml2-utils rsync
          mkdir -p "$RUNNER_TEMP/tizen-dl"
          curl -fsSL -o "$RUNNER_TEMP/tizen-dl/$TIZEN_CLI_INSTALLER" \
            "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VERSION}/${TIZEN_CLI_INSTALLER}"
          chmod +x "$RUNNER_TEMP/tizen-dl/$TIZEN_CLI_INSTALLER"
          "$RUNNER_TEMP/tizen-dl/$TIZEN_CLI_INSTALLER" --accept-license "$TIZEN_HOME"
          echo "$TIZEN_HOME/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$TIZEN_HOME/tools" >> "$GITHUB_PATH"
          # Certificate generator lives in an extra package of the web CLI install
          "$TIZEN_HOME/package-manager/package-manager-cli.bin" install --accept-license CERT-ADD-ON || true

      - name: Generate self-signed author + distributor certificate
        run: |
          set -euo pipefail
          CERT_DIR="$RUNNER_TEMP/tizen-certs"
          mkdir -p "$CERT_DIR"
          PW="ci-$(openssl rand -hex 8)"
          echo "::add-mask::$PW"
          # Author cert: generated fresh every run (self-signed, throwaway)
          tizen certificate -a YMPlayerCI -p "$PW" -c GB -n "YM Player CI" -f ymplayer-author -- "$CERT_DIR"
          # Register the profile with ONLY the author cert. The Tizen CLI then
          # applies its bundled default distributor certificate automatically, so
          # we don't hard-code a distributor .p12 path/password (that pair differs
          # between Tizen Studio versions and was the cause of the first failure).
          tizen security-profiles add -n ymplayer-ci \
            -a "$CERT_DIR/ymplayer-author.p12" -p "$PW"
          # On a headless runner there is no desktop keyring, so the CLI stores the
          # passwords as references to .pwd files it later can't read back
          # ("Invalid password" at package time). Rewrite profiles.xml with the
          # plaintext passwords: author = our generated one, distributor = the
          # Tizen SDK's public default distributor password.
          PROFILES="$TIZEN_HOME/../tizen-studio-data/profile/profiles.xml"
          AUTHOR_PW="$PW" python3 - "$PROFILES" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          tree = ET.parse(path)
          for prof in tree.getroot().iter('profile'):
              if prof.get('name') != 'ymplayer-ci':
                  continue
              for item in prof.iter('profileitem'):
                  kind = item.get('distributor')
                  if kind == '0':
                      item.set('password', os.environ['AUTHOR_PW'])
                  elif kind == '1' and item.get('key'):
                      item.set('password', 'tizenpkcs12passwd')
                  print('profileitem', kind, 'key=', item.get('key') or '(none)')
          tree.write(path)
          PY
          # Sanity check: the distributor .p12 must open with the default password
          DIST_KEY=$(python3 -c "import sys,xml.etree.ElementTree as E;r=E.parse(sys.argv[1]).getroot();print(next((i.get('key') for p in r.iter('profile') if p.get('name')=='ymplayer-ci' for i in p.iter('profileitem') if i.get('distributor')=='1'),''))" "$PROFILES")
          echo "distributor key: $DIST_KEY"
          if [ -n "$DIST_KEY" ]; then
            openssl pkcs12 -in "$DIST_KEY" -passin pass:tizenpkcs12passwd -noout 2>/dev/null \
              || openssl pkcs12 -legacy -in "$DIST_KEY" -passin pass:tizenpkcs12passwd -noout \
              && echo "distributor p12 opens with default password: OK"
          fi
          tizen security-profiles list

      - name: Stage app files (excludes dev files)
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/ymplayer-app"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          # Only runtime files ship: config.xml, index.html, js/, css/, assets/
          rsync -a \
            --exclude='*.test.js' \
            config.xml index.html js css assets "$STAGE/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          find "$STAGE" -type f | sort

      - name: tizen build-web + package .wgt
        run: |
          set -euo pipefail
          cd "$STAGE"
          # Surface the Tizen CLI log on any failure below (the CLI prints only
          # "An error has occurred. See the log file" to stdout).
          CLI_LOG="$TIZEN_HOME/../tizen-studio-data/cli/logs/cli.log"
          dump_log() { echo "::group::tizen cli.log"; tail -n 60 "$CLI_LOG" 2>/dev/null || echo "(no cli.log at $CLI_LOG)"; echo "::endgroup::"; }
          trap 'dump_log' ERR
          tizen build-web -- .
          mkdir -p "$GITHUB_WORKSPACE/out"
          # build-web writes to .buildResult; package that dir
          tizen package -t wgt -s ymplayer-ci -o "$GITHUB_WORKSPACE/out" -- "$STAGE/.buildResult"
          ls -l "$GITHUB_WORKSPACE/out"
          WGT=$(ls "$GITHUB_WORKSPACE"/out/*.wgt | head -n1)
          mv "$WGT" "$GITHUB_WORKSPACE/out/YMPlayer.wgt"
          unzip -l "$GITHUB_WORKSPACE/out/YMPlayer.wgt"
          # Guard: no tests/node_modules in the package
          if unzip -l "$GITHUB_WORKSPACE/out/YMPlayer.wgt" | grep -E 'node_modules|\.test\.js|/test/'; then
            echo "dev files leaked into the wgt"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: YMPlayer.wgt
          path: out/YMPlayer.wgt

      - name: Publish release (permanent latest link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: YM Player Tizen v${{ github.run_number }}
          files: out/YMPlayer.wgt
          make_latest: true
