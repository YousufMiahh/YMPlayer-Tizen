<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>YM Player</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/browse.css">
  <link rel="stylesheet" href="css/home.css">

  <link rel="stylesheet" href="css/settings.css">

  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <object id="av" type="application/avplayer" hidden></object>
  <div id="root"></div>
  <!-- Samsung's product APIs (webapis.avplay = the video player). The TV serves this path itself;
       it must load before the app (a classic script, so it runs ahead of the module below). -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script type="module">
    import { boot } from './js/app.js';
    boot(document.getElementById('root'));
  </script>
</body>
</html>
